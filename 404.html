<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scanasis | Page Not Found</title>
    <meta name="description" content="The page you requested could not be found. Continue to the Scanasis homepage, services, portfolio, or contact page.">
    <link rel="canonical" href="https://scanasis.com/404.html">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
      :root { color-scheme: dark; --bg:#020b18; --panel:#061428; --cyan:#00d4ff; --text:#e2f0fb; --muted:#8fafc8; --line:rgba(0,212,255,.18); }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; color:var(--text); background:var(--bg); font-family:Inter,system-ui,sans-serif; }
      main { width:min(720px,100%); padding:clamp(32px,7vw,72px); border:1px solid var(--line); background:linear-gradient(145deg,rgba(6,20,40,.96),rgba(2,11,24,.96)); box-shadow:0 24px 80px rgba(0,0,0,.4); }
      .eyebrow { color:var(--cyan); font:700 .72rem/1 Space Grotesk, sans-serif; letter-spacing:.18em; text-transform:uppercase; }
      h1 { margin:24px 0 14px; font:700 clamp(2.2rem,7vw,4.6rem)/1.02 Space Grotesk, sans-serif; letter-spacing:-.04em; }
      p { max-width:52ch; color:var(--muted); font-size:1.05rem; line-height:1.7; }
      nav { display:flex; flex-wrap:wrap; gap:12px; margin-top:32px; }
      a { color:var(--cyan); border:1px solid var(--line); padding:12px 18px; text-decoration:none; }
      a:first-child { color:var(--bg); border-color:var(--cyan); background:var(--cyan); font-weight:700; }
      a:focus-visible { outline:2px solid var(--cyan); outline-offset:4px; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Navigation error · 404</div>
      <h1>This page is off the model.</h1>
      <p>The address you followed does not match a Scanasis page. Return to the main site or explore our services and project work.</p>
      <nav aria-label="Helpful links">
        <a href="/">Back to Home</a>
        <a href="/services.html">View Services</a>
        <a href="/contact.html">Contact Us</a>
      </nav>
    </main>
  </body>
</html>
